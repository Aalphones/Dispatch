<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entwurf DISPATCH – Zugänge für Agenten und „Neuer Zugang“ (Meilenstein 4)</title>
<style>
/* ================= Tokens ================= */
:root {
  --paper: #f6f1e7; --paper-2: #efe7d8; --paper-3: #e6dcc9;
  --ink: #1d1a16; --ink-2: #4a443b; --ink-3: #6f675b;
  --rule: #cfc4b0; --rule-strong: #1d1a16;
  --accent: #b3261e; --accent-ink: var(--accent);
  --accent-soft: color-mix(in oklab, var(--accent-ink) 12%, var(--paper));
  --accent-line: color-mix(in oklab, var(--accent-ink) 40%, transparent);
  --ok: #2e6b3a; --warn: #9a5b00; --bad: #a3261e;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Charter, "Bitstream Charter", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --measure: 38rem; --wide: 74rem; --side: 12rem; --gap: 3rem;
  --t-fast: 140ms; --t-mid: 260ms; --t-slow: 520ms;
  --ease-out: cubic-bezier(.2,.7,.2,1); --ease-spring: cubic-bezier(.34,1.56,.64,1);
  --shadow-1: 0 1px 2px rgba(29,26,22,.06), 0 4px 14px rgba(29,26,22,.07);
  --shadow-2: 0 2px 6px rgba(29,26,22,.08), 0 18px 48px rgba(29,26,22,.16);
  --nav-h: 2.9rem;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not(.hell) { --paper:#17150f; --paper-2:#211e17; --paper-3:#2b271f; --ink:#ece5d8; --ink-2:#c9c0b0; --ink-3:#a39a8a; --rule:#3d382e; --rule-strong:#ece5d8; --accent-ink: color-mix(in oklab, var(--accent) 55%, white); --ok:#7fc28c; --warn:#e0a54a; --bad:#f08a80; --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-2: 0 18px 48px rgba(0,0,0,.55); }
}
:root.dunkel { --paper:#17150f; --paper-2:#211e17; --paper-3:#2b271f; --ink:#ece5d8; --ink-2:#c9c0b0; --ink-3:#a39a8a; --rule:#3d382e; --rule-strong:#ece5d8; --accent-ink: color-mix(in oklab, var(--accent) 55%, white); --ok:#7fc28c; --warn:#e0a54a; --bad:#f08a80; --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-2: 0 18px 48px rgba(0,0,0,.55); }

@view-transition { navigation: auto; }

* { box-sizing: border-box; }
html { background: var(--paper); color: var(--ink); scroll-behavior: smooth; scroll-padding-top: calc(var(--nav-h) + 1.5rem); }
body { margin: 0; font: 1.125rem/1.6 var(--serif); -webkit-font-smoothing: antialiased; overflow-x: clip; }
a { color: inherit; text-decoration-color: var(--rule); text-underline-offset: .18em; transition: text-decoration-color var(--t-fast); }
a:hover { text-decoration-color: var(--accent-ink); }
:focus-visible { outline: 3px solid var(--accent-ink); outline-offset: 2px; border-radius: 3px; }
button { font: inherit; color: inherit; }
img { max-width: 100%; display: block; }
.sprung { position: absolute; left: -999px; } .sprung:focus { left: 1rem; top: 1rem; background: var(--ink); color: var(--paper); padding: .5rem 1rem; z-index: 99; }
.wrap { max-width: var(--wide); margin: 0 auto; padding: 0 1.25rem; }
.klein { font: 600 .72rem/1.3 var(--sans); letter-spacing: .08em; text-transform: uppercase; }
.ico { width: 1em; height: 1em; vertical-align: -.125em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.nur-schmal { display: none !important; }

.fortschritt { position: fixed; inset: 0 0 auto 0; height: 3px; background: var(--accent-ink); transform-origin: 0 50%; transform: scaleX(0); z-index: 60; }
@supports (animation-timeline: scroll()) {
  .fortschritt { animation: fortschritt linear both; animation-timeline: scroll(root); }
  @keyframes fortschritt { to { transform: scaleX(1); } }
}

/* ================= Kopf ================= */
.leiste { border-bottom: 1px solid var(--rule); position: relative; z-index: 30; }
.leiste .wrap { display: flex; gap: 1rem; align-items: center; min-height: 3.4rem; color: var(--ink-3); }
.ausgabe { cursor: help; text-decoration: underline dotted var(--rule); text-underline-offset: .3em; white-space: nowrap; }
.kopf-rechts { margin-left: auto; display: flex; align-items: center; gap: .6rem; min-width: 0; }

.suche { position: relative; width: 17rem; flex: none; transition: width var(--t-mid) var(--ease-out); }
.suche:focus-within { width: min(34rem, 60vw); }
.suche-feld { display: flex; align-items: center; gap: .55rem; background: var(--paper-2); border: 1px solid var(--rule); border-radius: 999px; padding: .42rem .5rem .42rem .9rem; cursor: text; transition: border-color var(--t-fast), background var(--t-fast), box-shadow var(--t-mid) var(--ease-out); }
.suche-feld:hover { border-color: var(--ink-3); }
.suche:focus-within .suche-feld { background: var(--paper); border-color: var(--accent-ink); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow-1); }
.suche-feld .ico { color: var(--ink-3); transition: transform var(--t-mid) var(--ease-spring), color var(--t-fast); }
.suche:focus-within .suche-feld .ico { transform: rotate(-12deg) scale(1.12); color: var(--accent-ink); }
.suche-feld input { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; font: .95rem var(--sans); color: var(--ink); outline: none; text-overflow: ellipsis; }
.suche-feld input::placeholder { color: var(--ink-3); }
.suche-feld input::-webkit-search-cancel-button { display: none; }
kbd { font: 600 .68rem var(--sans); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: .05rem .38rem; background: var(--paper); color: var(--ink-2); white-space: nowrap; }
.taste { transition: opacity var(--t-fast); }
.suche:focus-within .taste { opacity: 0; }
.suche-zu { display: none; border: 0; background: none; color: var(--ink-2); font: 600 .85rem var(--sans); cursor: pointer; padding: .3rem .4rem; }
.panel { position: absolute; left: 0; right: 0; top: calc(100% + .5rem); background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow-2); padding: .5rem; opacity: 0; transform: translateY(-6px) scale(.98); transform-origin: top center; pointer-events: none; visibility: hidden; transition: opacity var(--t-mid) var(--ease-out), transform var(--t-mid) var(--ease-out), visibility 0s linear var(--t-mid); max-height: 70vh; overflow: auto; }
.suche:focus-within .panel { opacity: 1; transform: none; pointer-events: auto; visibility: visible; transition-delay: 0s; }
.panel h3 { font: 700 .66rem var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); margin: .6rem .6rem .35rem; }
.panel ul { list-style: none; margin: 0; padding: 0; }
.panel .reihe { display: flex; flex-wrap: wrap; gap: .35rem; padding: 0 .5rem .3rem; }
.treffer a { display: grid; grid-template-columns: 3.2rem minmax(0, 1fr); gap: .75rem; align-items: center; padding: .5rem; border-radius: 8px; text-decoration: none; transition: background var(--t-fast); animation: rein var(--t-mid) var(--ease-out) both; }
.treffer li:nth-child(2) a { animation-delay: 40ms; } .treffer li:nth-child(3) a { animation-delay: 80ms; }
.treffer a:hover, .treffer a.sel { background: var(--paper-2); }
.treffer img { width: 3.2rem; height: 2.4rem; object-fit: cover; border-radius: 5px; }
.treffer .t { font: 700 .98rem/1.25 var(--serif); display: block; }
.treffer .s { font: .8rem/1.35 var(--sans); color: var(--ink-3); display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
mark { background: var(--accent-soft); color: var(--ink); padding: 0 .1em; border-radius: 2px; box-shadow: inset 0 -2px 0 var(--accent-line); }
.panel-fuss { display: flex; gap: .9rem; border-top: 1px solid var(--rule); margin-top: .4rem; padding: .5rem .6rem .2rem; font: .72rem var(--sans); color: var(--ink-3); }
.leer { font: .85rem var(--sans); color: var(--ink-3); padding: .4rem .6rem; }

.konto { display: inline-flex; align-items: center; gap: .45rem; border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: .38rem .8rem .38rem .45rem; font: 600 .82rem var(--sans); color: var(--ink-2); cursor: pointer; white-space: nowrap; flex: none; transition: border-color var(--t-fast), background var(--t-fast), transform var(--t-fast); }
.konto:hover { border-color: var(--ink-3); background: var(--paper-2); }
.konto:active { transform: scale(.96); }
.konto .avatar { width: 1.6rem; height: 1.6rem; border-radius: 50%; display: grid; place-items: center; background: var(--paper-3); font-size: .8rem; }
body.angemeldet .konto { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-ink); }
body.angemeldet .konto .avatar { background: var(--accent-ink); color: var(--paper); font: 700 .78rem var(--sans); }
.zaehler { display: inline-grid; place-items: center; min-width: 1.2rem; height: 1.2rem; padding: 0 .3rem; border-radius: 999px; background: var(--accent-ink); color: var(--paper); font: 700 .68rem var(--sans); }

.titelkopf { text-align: center; padding: 1.75rem 0 1rem; }
.titelkopf a { text-decoration: none; }
.titelkopf .name { font-size: clamp(2.4rem, 9vw, 5.25rem); line-height: 1; letter-spacing: .02em; font-weight: 700; margin: 0; }
.nav { border-top: 3px double var(--rule-strong); border-bottom: 1px solid var(--rule-strong); position: sticky; top: 0; z-index: 20; background: color-mix(in oklab, var(--paper) 94%, transparent); backdrop-filter: blur(8px); }
.nav ul { list-style: none; margin: 0 auto; padding: 0 1.25rem; display: flex; justify-content: center; gap: .25rem 1.75rem; max-width: var(--wide); }
.nav a { display: block; padding: .6rem 0; text-decoration: none; position: relative; white-space: nowrap; }
.nav a::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--accent-ink); transform: scaleX(0); transition: transform var(--t-mid) var(--ease-out); }
.nav a:hover::after, .nav a[aria-current]::after { transform: scaleX(1); }
.nav .alle { color: var(--ink-3); font-style: italic; }

/* ================= Chips & Etiketten ================= */
.chips { display: flex; flex-wrap: wrap; gap: .4rem; list-style: none; padding: 0; margin: 0; }
.chip { display: inline-flex; align-items: center; gap: .35rem; font: 500 .8rem/1 var(--sans); border: 1px solid var(--rule); border-radius: 999px; padding: .4rem .72rem; text-decoration: none; background: var(--paper); color: var(--ink-2); cursor: pointer; white-space: nowrap; transition: border-color var(--t-fast), background var(--t-fast), color var(--t-fast), transform var(--t-fast) var(--ease-spring); }
.chip:hover { border-color: var(--accent-ink); color: var(--ink); background: var(--accent-soft); transform: translateY(-1px); }
.chip:active { transform: scale(.95); }
.chip.tag::before { content: "#"; color: var(--accent-ink); font-weight: 700; }
.chip.kat { border-radius: 6px; background: var(--paper-2); font-weight: 600; }
.chip.kat .ico { color: var(--accent-ink); }
.chip .zahl { color: var(--ink-3); font-size: .72rem; }
.chip.aktiv { background: var(--ink); color: var(--paper); border-color: var(--ink); animation: pop var(--t-mid) var(--ease-spring); }
.chip.aktiv::before, .chip.aktiv .zahl, .chip.aktiv .ico { color: inherit; }
.chip .x { margin-left: .1rem; opacity: .75; }
@keyframes pop { from { transform: scale(.8); opacity: 0; } }
.badge { display: inline-flex; align-items: center; gap: .38rem; font: 600 .74rem/1 var(--sans); border-radius: 999px; padding: .4rem .7rem .4rem .58rem; text-decoration: none; border: 0; cursor: default; transition: transform var(--t-fast) var(--ease-spring); }
.badge:hover { transform: translateY(-1px); }
.badge.ki { background: var(--accent-soft); color: var(--accent-ink); box-shadow: inset 0 0 0 1px var(--accent-line); }
.badge.quellen { background: color-mix(in oklab, var(--ok) 12%, var(--paper)); color: var(--ok); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--ok) 35%, transparent); cursor: pointer; }
.badge.zeit { background: var(--paper-2); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--rule); }
.badge.fokus { background: transparent; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--rule); cursor: pointer; transition: box-shadow var(--t-fast), color var(--t-fast), transform var(--t-fast) var(--ease-spring); }
.badge.fokus:hover { color: var(--accent-ink); box-shadow: inset 0 0 0 1px var(--accent-ink); }
.badge.fokus kbd { background: transparent; color: inherit; border-color: currentColor; opacity: .7; padding: 0 .3rem; }

/* ================= Karten & Startseite ================= */
.aufmacher { display: grid; grid-template-columns: 1.4fr 1fr; gap: 2rem; padding: 2rem 0; border-bottom: 1px solid var(--rule); }
.aufmacher h2 { font-size: clamp(1.7rem, 4vw, 2.9rem); line-height: 1.1; margin: .35rem 0 .6rem; text-wrap: balance; }
.aufmacher h2 a, .karte h3 a { text-decoration: none; }
.dach { color: var(--accent-ink); }
.teaser { color: var(--ink-2); margin: 0 0 .75rem; }
.meta { color: var(--ink-3); font: .8rem/1.4 var(--sans); margin: 0; }
.foto { display: block; position: relative; overflow: hidden; border-radius: 4px; background: var(--paper-2); }
.foto img { width: 100%; height: 100%; object-fit: cover; transition: transform var(--t-slow) var(--ease-out), filter var(--t-slow) var(--ease-out); }
.aufmacher .foto { aspect-ratio: 3 / 2; }
.aufmacher:hover .foto img, .karte:hover .foto img { transform: scale(1.04); }
.raster { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 1.5rem 0 0; }
.karte { position: relative; padding: 0 1.25rem 1.75rem; border-left: 1px solid var(--rule); min-width: 0; }
.karte:nth-child(3n+1) { border-left: 0; padding-left: 0; }
.karte:nth-child(3n) { padding-right: 0; }
.karte h3 { font-size: 1.3rem; line-height: 1.2; margin: .5rem 0 .4rem; transition: color var(--t-fast); }
.karte:hover h3 { color: var(--accent-ink); }
.karte .foto { aspect-ratio: 16 / 9; margin-bottom: .65rem; }
.neu { animation: rein var(--t-slow) var(--ease-out) both; }
@keyframes rein { from { opacity: 0; transform: translateY(10px); } }

/* Seitenzahlen */
.seiten { display: flex; align-items: center; justify-content: space-between; gap: 1rem; border-top: 1px solid var(--rule-strong); margin-top: .5rem; padding: 1.1rem 0 2.75rem; font: .88rem var(--sans); }
.seiten ol { list-style: none; display: flex; gap: .3rem; margin: 0; padding: 0; }
.seiten ol a { display: grid; place-items: center; min-width: 2.4rem; height: 2.4rem; border-radius: 8px; text-decoration: none; color: var(--ink-2); transition: background var(--t-fast), color var(--t-fast), transform var(--t-fast) var(--ease-spring); }
.seiten ol a:hover { background: var(--paper-2); transform: translateY(-1px); }
.seiten ol a[aria-current] { background: var(--ink); color: var(--paper); font-weight: 700; }
.seiten .weiter-knopf { display: inline-flex; align-items: center; gap: .4rem; text-decoration: none; padding: .55rem .85rem; border: 1px solid var(--rule); border-radius: 8px; color: var(--ink-2); transition: border-color var(--t-fast), transform var(--t-fast) var(--ease-spring); }
.seiten .weiter-knopf:hover { border-color: var(--ink-3); transform: translateX(2px); }
.seiten .weiter-knopf.zurueck:hover { transform: translateX(-2px); }
.seiten [aria-disabled="true"] { opacity: .35; pointer-events: none; }
.seiten .stand { display: none; color: var(--ink-3); }

/* ================= Artikel ================= */
.artikel { padding: 1.5rem 0 3rem; }
.krumen { font: .8rem var(--sans); color: var(--ink-3); }
.krumen ol { list-style: none; padding: 0; margin: 0; display: flex; gap: .4rem; flex-wrap: wrap; }
.krumen li + li::before { content: "›"; margin-right: .4rem; }
.artikelkopf { max-width: 48rem; margin: 1.25rem auto 1.5rem; text-align: center; }
.artikelkopf h1 { font-size: clamp(2rem, 5.5vw, 3.6rem); line-height: 1.05; margin: .4rem 0 .75rem; text-wrap: balance; }
.artikelkopf .unterzeile { font-style: italic; font-size: clamp(1.1rem, 2.4vw, 1.3rem); color: var(--ink-2); margin: 0 0 1rem; text-wrap: balance; }
.autor { display: flex; justify-content: center; flex-wrap: wrap; gap: .3rem .9rem; font: .85rem var(--sans); color: var(--ink-3); }
.badges { display: flex; justify-content: center; flex-wrap: wrap; gap: .45rem; margin-top: .8rem; }
.titelbild { max-width: 64rem; margin: 0 auto 2.5rem; }
.titelbild .foto { aspect-ratio: 2 / 1; }
figcaption { font: .8rem/1.45 var(--sans); color: var(--ink-3); margin-top: .5rem; }
figcaption .nachweis { opacity: .75; }

/* Dreispaltig: links Navigation, Mitte Text, rechts "Kurz gesagt". Nichts ragt in die linke Spalte. */
.koerper { display: grid; grid-template-columns: var(--side) minmax(0, var(--measure)) var(--side); column-gap: var(--gap); justify-content: center; }
.seitenspalte { position: sticky; top: calc(var(--nav-h) + 1.25rem); align-self: start; font: .85rem/1.45 var(--sans); display: grid; gap: 1.75rem; max-height: calc(100vh - var(--nav-h) - 2.5rem); overflow: auto; transition: opacity var(--t-mid), transform var(--t-mid) var(--ease-out); }
.seitenspalte.weg { opacity: 0; transform: translateX(-8px); pointer-events: none; }
.iv ol { list-style: none; margin: .6rem 0 0; padding: 0; position: relative; border-left: 2px solid var(--rule); counter-reset: iv; }
.iv li { counter-increment: iv; }
.iv a { display: block; padding: .38rem 0 .38rem .9rem; text-decoration: none; color: var(--ink-3); transition: color var(--t-fast); }
.iv a::before { content: counter(iv, decimal-leading-zero) " "; font-variant-numeric: tabular-nums; color: var(--rule); margin-right: .2rem; transition: color var(--t-fast); }
.iv a:hover { color: var(--ink); }
.iv a[aria-current] { color: var(--ink); font-weight: 600; }
.iv a[aria-current]::before { color: var(--accent-ink); }
.iv .marker { position: absolute; left: -2px; top: 0; width: 2px; height: 2rem; background: var(--accent-ink); border-radius: 2px; transition: transform var(--t-mid) var(--ease-out), height var(--t-mid) var(--ease-out); }
.seitenspalte .chips { margin-top: .6rem; }

.text { min-width: 0; }
.text > * { margin: 0 0 1.15rem; }
.text h2 { font-size: 1.65rem; line-height: 1.2; margin: 2.6rem 0 .9rem; text-wrap: balance; clear: both; }
.lead { font-size: 1.28rem; line-height: 1.5; }
.dropcap::first-letter { float: left; font-size: 4.2em; line-height: .82; padding: .05em .08em 0 0; color: var(--accent-ink); font-weight: 700; }
/* "Kurz gesagt": breit in der rechten Spalte (negativer Außenabstand), schmal als Kasten im Text */
.kurz { font: .84rem/1.5 var(--sans); color: var(--ink-2); background: var(--paper-2); border-radius: 10px; padding: .8rem .95rem .85rem; box-shadow: inset 3px 0 0 var(--accent-ink); }
.kurz b { display: flex; align-items: center; gap: .35rem; font: 700 .66rem var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--accent-ink); margin-bottom: .3rem; }
.kurz.gesamt { background: var(--accent-soft); }
.callout { border-left: 4px solid var(--accent-ink); background: var(--paper-2); padding: .9rem 1.1rem; font-size: 1rem; border-radius: 0 8px 8px 0; }
.factbox { border: 1px solid var(--rule-strong); padding: 1rem 1.2rem; font: .95rem/1.5 var(--sans); border-radius: 4px; }
.factbox h3 { font: 700 .78rem var(--sans); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 .5rem; color: var(--accent-ink); }
.factbox ul { margin: 0; padding-left: 1.1rem; }
.pullquote { font-size: 1.65rem; line-height: 1.3; font-style: italic; text-align: center; border-block: 1px solid var(--rule); padding: 1.3rem .5rem; margin: 2.2rem 0; text-wrap: balance; }
.pullquote cite { display: block; font: normal .8rem var(--sans); color: var(--ink-3); margin-top: .5rem; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; text-align: center; border-block: 1px solid var(--rule); padding: 1rem 0; }
.stat b { display: block; font-size: 2rem; line-height: 1.1; color: var(--accent-ink); }
.stat span { font: .8rem/1.3 var(--sans); color: var(--ink-3); }
sup a { text-decoration: none; color: var(--accent-ink); font: 600 .7rem var(--sans); }

/* Bilder im Text. Regel: inline/left/right bleiben in der Textspalte; wide und Galerie
   nutzen zusätzlich die rechte Spalte, aber erst unterhalb eines "Kurz gesagt" (clear);
   full geht über die ganze Breite, die linke Navigation blendet sich so lange aus. */
.abb { margin: 2rem 0; }
.abb .foto { cursor: zoom-in; }
.abb .foto img { aspect-ratio: 3 / 2; }
.abb:hover .foto img { transform: scale(1.02); }
.abb[data-layout="wide"], .galerie { clear: both; margin-right: calc(-1 * (var(--side) + var(--gap))); }
.abb[data-layout="full"] { clear: both; position: relative; z-index: 2; width: 100vw; margin-left: calc(50% - 50vw); }
.abb[data-layout="full"] .foto { border-radius: 0; }
.abb[data-layout="full"] .foto img { aspect-ratio: 21 / 9; }
.abb[data-layout="full"] figcaption { max-width: calc(var(--measure) + 2.5rem); margin-inline: auto; padding: 0 1.25rem; }
.abb[data-layout="left"] { float: left; width: 46%; margin: .3rem 1.5rem 1rem 0; }
.abb[data-layout="right"] { float: right; width: 46%; margin: .3rem 0 1rem 1.5rem; }
.abb[data-layout="left"] .foto img, .abb[data-layout="right"] .foto img { aspect-ratio: 4 / 5; }
.galerie { display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; gap: .5rem; margin-top: 2rem; margin-bottom: 2rem; }
.galerie .foto:first-child { grid-row: span 2; }
.galerie .foto img { aspect-ratio: auto; height: 100%; min-height: 9rem; }
.galerie figcaption { grid-column: 1 / -1; }

@media (min-width: 62.01rem) {
  .kurz { float: right; clear: right; width: var(--side); margin: .3rem calc(-1 * (var(--side) + var(--gap))) 1rem 0; }
}

.transparenz { border: 1px solid var(--rule); background: var(--paper-2); padding: 1rem 1.2rem; font: .9rem/1.5 var(--sans); margin-top: 2.5rem; display: flex; gap: .8rem; border-radius: 10px; clear: both; }
.transparenz .ico { font-size: 1.3rem; color: var(--accent-ink); margin-top: .1rem; }
.quellen { font: .88rem/1.5 var(--sans); clear: both; }
.abschnitt-titel { font: 700 .78rem var(--sans); text-transform: uppercase; letter-spacing: .08em; border-top: 1px solid var(--rule-strong); padding-top: .8rem; margin-top: 2.5rem; }
.quellen ol { padding-left: 1.4rem; }
.quellen li { margin: .4rem 0; overflow-wrap: anywhere; }
.quellen li.blitz { background: var(--accent-soft); border-radius: 4px; animation: pop var(--t-mid) var(--ease-out); }
.vornach { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; border-block: 1px solid var(--rule); padding: 1rem 0; margin-top: 2rem; font-size: 1rem; clear: both; }
.vornach a { text-decoration: none; } .vornach .klein { display: block; color: var(--ink-3); }
.vornach div:last-child { text-align: right; }
.tags-unten { clear: both; }

/* Inhaltsverzeichnis schmal: klebt unter der Kategorie-Leiste und zeigt den aktuellen Abschnitt */
.iv-mobil { position: sticky; top: var(--nav-h); z-index: 14; margin: 0 -1.25rem 1.25rem; background: color-mix(in oklab, var(--paper) 94%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); font: .85rem var(--sans); }
.iv-mobil summary { list-style: none; display: flex; align-items: center; gap: .6rem; padding: .7rem 1.25rem; cursor: pointer; }
.iv-mobil summary::-webkit-details-marker { display: none; }
.iv-mobil summary .klein { color: var(--accent-ink); }
.iv-mobil summary .jetzt { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 600; }
.iv-mobil summary .pfeil { transition: transform var(--t-mid) var(--ease-out); }
.iv-mobil[open] summary .pfeil { transform: rotate(180deg); }
.iv-mobil ol { margin: 0; padding: 0 1.25rem .8rem 2.6rem; }
.iv-mobil li { padding: .3rem 0; }
.iv-mobil a { text-decoration: none; }

/* ================= Fokusmodus ================= */
.fokus-raus { position: fixed; top: 1rem; right: 1rem; z-index: 70; display: none; align-items: center; gap: .5rem; background: var(--ink); color: var(--paper); border: 0; border-radius: 999px; padding: .55rem .9rem; font: 600 .82rem var(--sans); cursor: pointer; box-shadow: var(--shadow-2); opacity: .2; transition: opacity var(--t-mid); }
.fokus-raus:hover, .fokus-raus:focus-visible, body.fokus.maus .fokus-raus { opacity: 1; }
.fokus-raus kbd { background: transparent; color: inherit; border-color: color-mix(in oklab, var(--paper) 40%, transparent); }
body.fokus .fokus-raus { display: inline-flex; }
body.fokus header, body.fokus .fuss, body.fokus .seitenspalte, body.fokus .iv-mobil, body.fokus .kurz, body.fokus .krumen, body.fokus .redkasten, body.fokus .badges, body.fokus .mehr-dazu, body.fokus .vornach, body.fokus .fab, body.fokus .pult, body.fokus .tags-unten, body.fokus .reaktion-unten { display: none !important; }
/* Fokus nutzt die Bildschirmbreite: breite Spalte, Schrift wächst mit, Bilder randlos */
body.fokus { --fokus-breite: min(68rem, 92vw); }
body.fokus .artikel.wrap { max-width: none; padding-top: 4rem; }
body.fokus .koerper { grid-template-columns: minmax(0, var(--fokus-breite)); }
body.fokus .text { font-size: clamp(1.15rem, .9rem + .55vw, 1.45rem); line-height: 1.75; }
body.fokus .text .stats { grid-template-columns: repeat(3, 1fr); }
body.fokus .artikelkopf { max-width: var(--fokus-breite); }
body.fokus .artikelkopf h1 { font-size: clamp(2.2rem, 4.5vw, 4.4rem); }
body.fokus .titelbild { max-width: var(--fokus-breite); }
body.fokus .abb[data-layout="wide"], body.fokus .galerie { margin-right: 0; }
body.fokus .abb[data-layout="left"], body.fokus .abb[data-layout="right"] { float: none; width: auto; margin: 2rem 0; }

/* ================= Alle Kategorien ================= */
.seitenkopf { text-align: center; padding: 2rem 0 1rem; }
.seitenkopf h1 { font-size: clamp(1.9rem, 5vw, 3rem); margin: .3rem 0; overflow-wrap: anywhere; }
.seitenkopf p { color: var(--ink-2); margin: 0; font-style: italic; }
.katgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1rem; padding: 1.5rem 0 3rem; }
.katkarte { grid-column: span 2; position: relative; isolation: isolate; overflow: hidden; border-radius: 14px; min-height: 19rem; color: #fff; text-decoration: none; display: flex; flex-direction: column; justify-content: flex-end; padding: 1.4rem; box-shadow: var(--shadow-1); transition: box-shadow var(--t-mid), transform var(--t-mid) var(--ease-out); }
.katkarte.gross { grid-column: span 3; min-height: 23rem; }
.katkarte img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; transition: transform var(--t-slow) var(--ease-out), filter var(--t-slow) var(--ease-out); }
.katkarte::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(10,8,5,0) 25%, rgba(10,8,5,.82) 100%); transition: background var(--t-slow) var(--ease-out); }
.katkarte::after { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--accent); mix-blend-mode: multiply; opacity: 0; transition: opacity var(--t-slow) var(--ease-out); }
.katkarte:hover, .katkarte:focus-visible { transform: translateY(-3px); box-shadow: var(--shadow-2); }
.katkarte:hover img, .katkarte:focus-visible img { transform: scale(1.08); filter: blur(3px) saturate(.6) brightness(.85); }
.katkarte:hover::after, .katkarte:focus-visible::after { opacity: .55; }
.katkarte:hover::before { background: linear-gradient(180deg, rgba(10,8,5,.15) 0%, rgba(10,8,5,.85) 100%); }
.katkarte .klein { opacity: .85; }
.katkarte h2 { font-size: clamp(1.6rem, 3vw, 2rem); line-height: 1.05; margin: .25rem 0 .35rem; display: flex; align-items: center; gap: .5rem; }
.katkarte h2 .pfeil { display: inline-block; font-size: 1.3rem; opacity: 0; transform: translateX(-8px); transition: opacity var(--t-mid), transform var(--t-mid) var(--ease-spring); }
.katkarte:hover h2 .pfeil { opacity: 1; transform: none; }
.katkarte p { margin: 0; font-size: .98rem; line-height: 1.45; opacity: .92; max-width: 30rem; }
.katkarte .mehr { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--t-slow) var(--ease-out); }
.katkarte .mehr > div { overflow: hidden; }
.katkarte:hover .mehr, .katkarte:focus-within .mehr { grid-template-rows: 1fr; }
.katkarte .unterkat { display: flex; gap: .35rem; flex-wrap: wrap; padding-top: .8rem; }
.katkarte .unterkat span { font: 600 .74rem var(--sans); background: rgba(255,255,255,.16); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: .3rem .6rem; }
.katkarte .neuester { font: .78rem var(--sans); opacity: .85; padding-top: .6rem; }
.katkarte .gewicht-inline { position: absolute; top: 1rem; right: 1rem; }
/* Touch-Geräte haben kein Hover: Unterkategorien immer zeigen, kein Weichzeichner */
@media (hover: none) {
  .katkarte .mehr { grid-template-rows: 1fr; }
  .katkarte h2 .pfeil { opacity: 1; transform: none; }
  .katkarte:active img { filter: blur(2px) brightness(.85); }
}

/* ================= Schnellfilter ================= */
.filterleiste { position: sticky; top: var(--nav-h); z-index: 15; background: color-mix(in oklab, var(--paper) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); padding: .75rem 0; }
.filterleiste .wrap { display: grid; gap: .55rem; }
.filterzeile { display: flex; align-items: center; gap: .6rem; font: .82rem var(--sans); color: var(--ink-3); min-width: 0; }
.filterzeile > b { color: var(--ink-2); font-weight: 600; min-width: 7rem; flex: none; }
.filterzeile .chips { flex-wrap: wrap; }
.ergebniszahl { font: .85rem var(--sans); color: var(--ink-3); padding-top: 1rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
.ergebniszahl b { color: var(--ink); font-variant-numeric: tabular-nums; display: inline-block; }
.ergebniszahl b.neu { animation: pop var(--t-mid) var(--ease-spring); }
.leeren { background: none; border: 0; color: var(--accent-ink); font: 600 .8rem var(--sans); cursor: pointer; text-decoration: underline; flex: none; }

/* ================= Fuß ================= */
.fuss { border-top: 3px double var(--rule-strong); padding: 2rem 0 3rem; color: var(--ink-3); font: .85rem/1.6 var(--sans); clear: both; }
.fuss .spalten { display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; }
.fuss h2 { font: 700 .72rem var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 .7rem; }
.fuss nav { display: flex; flex-direction: column; gap: .2rem; }
.fuss .unten { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem; border-top: 1px solid var(--rule); margin-top: 1.5rem; padding-top: 1rem; }

/* ================= Redaktion (nur nach Login) ================= */
.red { display: none !important; }
body.angemeldet .red { display: revert !important; }
body.angemeldet .red.flex { display: flex !important; }
body.angemeldet .red.grid { display: grid !important; }
body.angemeldet .nur-gast { display: none !important; }
.red-fade { animation: rein var(--t-slow) var(--ease-out) both; }

[popover] { margin: 0; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); border-radius: 12px; box-shadow: var(--shadow-2); padding: .4rem; min-width: 16rem; font: .9rem var(--sans); inset: auto; position: fixed; top: 3.6rem; right: 1rem; opacity: 0; transform: translateY(-6px) scale(.97); transform-origin: top right; transition: opacity var(--t-mid) var(--ease-out), transform var(--t-mid) var(--ease-out), overlay var(--t-mid) allow-discrete, display var(--t-mid) allow-discrete; }
[popover]:popover-open { opacity: 1; transform: none; }
@starting-style { [popover]:popover-open { opacity: 0; transform: translateY(-6px) scale(.97); } }
.menue a, .menue button { display: flex; align-items: center; gap: .65rem; width: 100%; text-align: left; padding: .6rem .7rem; border-radius: 8px; border: 0; background: none; cursor: pointer; text-decoration: none; transition: background var(--t-fast); }
.menue a:hover, .menue button:hover { background: var(--paper-2); }
.menue .ico { color: var(--ink-3); font-size: 1.05rem; }
.menue hr { border: 0; border-top: 1px solid var(--rule); margin: .35rem 0; }
.menue .zaehler { margin-left: auto; }
.menue .kopfzeile { padding: .5rem .7rem .6rem; font-size: .78rem; color: var(--ink-3); }

.wartet { padding: 1.5rem 0 .5rem; }
.wartet-kopf { display: flex; align-items: baseline; gap: .75rem; margin-bottom: .9rem; flex-wrap: wrap; }
.wartet-kopf h2 { font-size: 1.35rem; margin: 0; }
.wartet-kopf span { font: .8rem var(--sans); color: var(--ink-3); }
.wartet-reihe { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
.wartekarte { border: 1.5px dashed var(--accent-line); border-radius: 12px; padding: 1rem; background: color-mix(in oklab, var(--accent-soft) 45%, var(--paper)); display: grid; gap: .55rem; align-content: start; transition: border-color var(--t-fast), transform var(--t-mid) var(--ease-out), box-shadow var(--t-mid); }
.wartekarte:hover { border-color: var(--accent-ink); transform: translateY(-2px); box-shadow: var(--shadow-1); }
.wartekarte h3 { font-size: 1.1rem; line-height: 1.25; margin: 0; }
.wartekarte .zeile { display: flex; gap: .4rem; flex-wrap: wrap; }
.vorher-nachher { font: .8rem/1.45 var(--sans); }
del { color: var(--bad); text-decoration-thickness: 1px; background: color-mix(in oklab, var(--bad) 8%, transparent); }
ins { color: var(--ok); text-decoration: none; background: color-mix(in oklab, var(--ok) 10%, transparent); }
.status { display: inline-flex; align-items: center; gap: .3rem; font: 700 .64rem var(--sans); letter-spacing: .06em; text-transform: uppercase; border-radius: 4px; padding: .22rem .45rem; width: fit-content; }
.status.review { background: color-mix(in oklab, var(--warn) 16%, var(--paper)); color: var(--warn); }
.status.zurueck { background: var(--paper-3); color: var(--ink-2); }
.status.vorschlag { background: var(--accent-soft); color: var(--accent-ink); }

.knopf { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; font: 600 .82rem var(--sans); border-radius: 8px; padding: .5rem .85rem; border: 1px solid var(--rule); background: var(--paper); cursor: pointer; text-decoration: none; white-space: nowrap; transition: background var(--t-fast), border-color var(--t-fast), transform var(--t-fast) var(--ease-spring), box-shadow var(--t-fast); }
.knopf:hover { border-color: var(--ink-3); box-shadow: var(--shadow-1); }
.knopf:active { transform: scale(.96); }
.knopf.primaer { background: var(--accent-ink); color: var(--paper); border-color: var(--accent-ink); }
.knopf.primaer:hover { background: color-mix(in oklab, var(--accent-ink) 88%, black); }
.knopf.leise { border-color: transparent; background: transparent; color: var(--ink-2); }
.knopf.gefahr { color: var(--bad); }
.knopf.klein-k { padding: .32rem .6rem; font-size: .76rem; }

.reaktion { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; background: var(--paper); overflow: hidden; box-shadow: var(--shadow-1); }
.reaktion button { display: inline-flex; align-items: center; gap: .35rem; border: 0; background: none; padding: .45rem .75rem; font: 600 .78rem var(--sans); color: var(--ink-2); cursor: pointer; transition: background var(--t-fast), color var(--t-fast); }
.reaktion button + button { border-left: 1px solid var(--rule); }
.reaktion button:hover { background: var(--paper-2); }
.reaktion button .ico { transition: transform var(--t-mid) var(--ease-spring); }
.reaktion button:hover .ico { transform: scale(1.18) rotate(-8deg); }
.reaktion button[aria-pressed="true"].mehr { background: color-mix(in oklab, var(--ok) 14%, var(--paper)); color: var(--ok); }
.reaktion button[aria-pressed="true"].weniger { background: color-mix(in oklab, var(--bad) 12%, var(--paper)); color: var(--bad); }
.reaktion button[aria-pressed="true"] .ico { animation: hops var(--t-slow) var(--ease-spring); }
@keyframes hops { 40% { transform: scale(1.45) rotate(-12deg); } }
.reaktion.mini { position: absolute; top: .6rem; right: 1.85rem; opacity: 0; transform: translateY(-4px); transition: opacity var(--t-mid), transform var(--t-mid) var(--ease-out); z-index: 2; }
.karte:nth-child(3n) .reaktion.mini { right: .6rem; }
.karte:hover .reaktion.mini, .reaktion.mini:focus-within, .reaktion.mini.gesetzt { opacity: 1; transform: none; }
.reaktion.mini button { padding: .4rem .55rem; }
@media (hover: none) { .reaktion.mini { opacity: 1; transform: none; } }
.kennzahl { font: .72rem var(--sans); color: var(--ink-3); display: inline-flex; gap: .35rem; align-items: center; }

.redkasten { max-width: 48rem; margin: 0 auto 2rem; border: 1px solid var(--accent-line); background: color-mix(in oklab, var(--accent-soft) 50%, var(--paper)); border-radius: 14px; padding: .9rem 1rem; grid-template-columns: 1fr auto; gap: .8rem 1.2rem; align-items: center; font: .85rem var(--sans); }
.redkasten .zahlen { display: flex; gap: 1.2rem; flex-wrap: wrap; color: var(--ink-2); align-items: flex-end; }
.redkasten .zahlen b { font: 700 1.1rem var(--serif); color: var(--ink); display: block; }
.redkasten .aktionen { display: flex; gap: .4rem; flex-wrap: wrap; justify-content: flex-end; }
.redkasten .hinweiszeile { grid-column: 1 / -1; display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; border-top: 1px dashed var(--accent-line); padding-top: .7rem; color: var(--ink-2); }
.funken { display: flex; align-items: flex-end; gap: 2px; height: 1.6rem; }
.funken i { width: 5px; background: var(--accent-ink); border-radius: 2px 2px 0 0; opacity: .75; }

.freigabe { position: sticky; top: var(--nav-h); z-index: 16; background: color-mix(in oklab, var(--paper) 94%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--accent-line); }
.freigabe .wrap { display: flex; gap: .6rem 1rem; align-items: center; flex-wrap: wrap; padding-block: .7rem; font: .85rem var(--sans); }
.pruefung { display: flex; gap: .35rem; flex-wrap: wrap; margin-right: auto; }
.pruef { display: inline-flex; align-items: center; gap: .3rem; font: 600 .74rem var(--sans); padding: .3rem .55rem; border-radius: 999px; white-space: nowrap; }
.pruef.ok { color: var(--ok); background: color-mix(in oklab, var(--ok) 12%, var(--paper)); }
.pruef.warn { color: var(--warn); background: color-mix(in oklab, var(--warn) 14%, var(--paper)); }
.freigabe-knoepfe { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
.vorschau-band { text-align: center; font: 700 .7rem var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--warn); padding: .6rem 0 0; }
.anmerkung { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--t-mid) var(--ease-out); width: 100%; }
.anmerkung > div { overflow: hidden; }
.anmerkung.offen { grid-template-rows: 1fr; }
.anmerkung textarea { width: 100%; min-height: 4.5rem; margin-top: .3rem; font: .9rem var(--sans); padding: .6rem; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); }

/* Kommentieren in der Vorschau: Stelle anklicken oder Text markieren, Anmerkung schreiben */
.k-hinweis { display: none; text-align: center; font: 600 .78rem var(--sans); color: var(--accent-ink); background: var(--accent-soft); padding: .45rem 1rem; }
body.k-modus .k-hinweis { display: block; animation: rein var(--t-mid) var(--ease-out); }
body.k-modus #v-vorschau .text > :not(.k-liste-schmal):hover { outline: 2px dashed var(--accent-ink); outline-offset: 5px; border-radius: 3px; cursor: crosshair; }
body.k-modus #v-vorschau .text { user-select: text; }
#kommentieren[aria-pressed="true"] { background: var(--accent-ink); color: var(--paper); border-color: var(--accent-ink); }
.kommentiert { position: relative; outline: 2px solid var(--accent-line); outline-offset: 5px; border-radius: 3px; }
.k-nr { position: absolute; left: -2.6rem; top: 0; width: 1.6rem; height: 1.6rem; border-radius: 50%; display: grid; place-items: center; background: var(--accent-ink); color: var(--paper); font: 700 .72rem var(--sans); cursor: pointer; animation: pop var(--t-mid) var(--ease-spring); box-shadow: var(--shadow-1); }
.k-mark { background: var(--accent-soft); box-shadow: inset 0 -2px 0 var(--accent-ink); border-radius: 2px; cursor: pointer; }
.k-mark sup { font: 700 .62rem var(--sans); color: var(--accent-ink); margin-left: .1rem; }
.k-box { position: absolute; z-index: 50; width: min(22rem, calc(100vw - 2rem)); background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow-2); padding: .8rem; font: .88rem var(--sans); animation: pop var(--t-mid) var(--ease-spring); }
.k-box[hidden] { display: none; }
.k-box blockquote { margin: 0 0 .5rem; padding: .35rem .6rem; border-left: 3px solid var(--accent-ink); background: var(--paper-2); color: var(--ink-2); font-size: .8rem; max-height: 4.2rem; overflow: hidden; border-radius: 0 6px 6px 0; }
.k-box textarea { width: 100%; min-height: 4.5rem; font: .92rem var(--sans); padding: .55rem; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); resize: vertical; }
.k-box textarea:focus { outline: none; border-color: var(--accent-ink); box-shadow: 0 0 0 3px var(--accent-soft); }
.k-box .k-knoepfe { display: flex; justify-content: flex-end; gap: .4rem; margin-top: .5rem; }
/* min-width: 0 – sonst zieht das lange Zitat (nowrap) die Spalte über den Bildschirm hinaus */
.k-liste { position: sticky; top: calc(var(--nav-h) + 6rem); align-self: start; font: .82rem/1.45 var(--sans); min-width: 0; }
.k-liste h3 { font: 700 .7rem var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 .6rem; }
.k-liste ol { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
.k-liste li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .2rem .45rem; align-items: start; min-width: 0; border: 1px solid var(--rule); border-radius: 10px; padding: .55rem .4rem .55rem .65rem; background: var(--paper); cursor: pointer; transition: border-color var(--t-fast), transform var(--t-fast) var(--ease-spring); animation: rein var(--t-mid) var(--ease-out); }
.k-liste li:hover { border-color: var(--accent-ink); transform: translateX(-2px); }

.wahl:has(input:checked) { border-color: var(--accent-line); background: var(--accent-soft); }
.wahl input { width: 1.15rem; height: 1.15rem; margin: .1rem 0 0; accent-color: var(--accent-ink); }
.wahl b { font: 600 .9rem var(--sans); }
.wahl small { grid-column: 2; color: var(--ink-3); font-size: .8rem; }
.feldfehler { color: var(--bad); font: 500 .8rem var(--sans); margin: -.55rem 0 .9rem; }
label.feld input[aria-invalid="true"] { border-color: var(--bad); }
.feldhilfe { font: 400 .78rem var(--sans); color: var(--ink-3); }
.erfolg { display: flex; gap: .6rem; align-items: center; color: var(--ok); font: 600 .92rem var(--sans); margin: 0 0 .4rem; }
.erfolg .ico { width: 1.3rem; height: 1.3rem; }
.kopierfeld { display: flex; gap: .5rem; align-items: stretch; margin: .3rem 0 1rem; }
.kopierfeld code, .kopierfeld pre { flex: 1; min-width: 0; margin: 0; font: .82rem/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace; background: var(--paper-2); border: 1px solid var(--rule); border-radius: 8px; padding: .6rem .7rem; overflow-wrap: anywhere; white-space: pre-wrap; user-select: all; }
.kopierfeld .knopf { flex: none; align-self: flex-start; }
.kopierfeld .knopf.ok { color: var(--ok); border-color: var(--ok); }
.ergebnis-titel { font: 600 .82rem var(--sans); margin: 0; }
.warn-hinweis { background: color-mix(in oklab, var(--warn) 12%, var(--paper)); color: var(--ink-2); border-left: 3px solid var(--warn); }
.stand { animation: rein var(--t-mid) var(--ease-out); }
@keyframes rein { from { opacity: 0; transform: translateY(6px); } }
/* Entwurfs-Pult: gehört nicht zur Website */
.pult { position: fixed; left: .75rem; top: .75rem; z-index: 200; display: flex; gap: .35rem; flex-wrap: wrap; max-width: calc(100vw - 1.5rem); font: .74rem var(--sans); }
.pult button { font: inherit; padding: .3rem .55rem; border-radius: 6px; border: 1px solid var(--rule); background: var(--paper-2); color: var(--ink-2); cursor: pointer; }
.pult button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.pult .stufe { padding: .3rem .55rem; border-radius: 6px; background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; }
@media (max-width: 575px) { .kopierfeld { flex-direction: column; } .kopierfeld .knopf { align-self: stretch; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-suche" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-ki" viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5 13.8 11.3 12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></symbol>
  <symbol id="i-quelle" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 7h6"/></symbol>
  <symbol id="i-uhr" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-ordner" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-hoch" viewBox="0 0 24 24"><path d="M7 10v11M15 5.9 14 10h5.8a2 2 0 0 1 2 2.3l-1.4 7A2 2 0 0 1 18.4 21H7V10l4.2-7.4A1.9 1.9 0 0 1 15 5.9z"/></symbol>
  <symbol id="i-runter" viewBox="0 0 24 24"><path d="M17 14V3M9 18.1 10 14H4.2a2 2 0 0 1-2-2.3l1.4-7A2 2 0 0 1 5.6 3H17v11l-4.2 7.4A1.9 1.9 0 0 1 9 18.1z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></symbol>
  <symbol id="i-schluessel" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.3-9.3M17 6l3 3M14 9l2 2"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18M7 15l4-4 3 3 5-6"/></symbol>
  <symbol id="i-herz" viewBox="0 0 24 24"><path d="M19.5 12.6 12 20l-7.5-7.4A5 5 0 1 1 12 6a5 5 0 1 1 7.5 6.6z"/></symbol>
  <symbol id="i-tuer" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
  <symbol id="i-auge" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-stift" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-fokus" viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></symbol>
  <symbol id="i-liste" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
</svg>
<div class="pult" aria-label="Entwurfs-Pult (nicht Teil der Website)">
  <span class="stufe" id="stufe">–</span>
  <button id="p-oeffnen">Dialog öffnen</button>
  <button id="p-leer" aria-pressed="false">Leere Liste</button>
  <button id="p-thema">Hell/Dunkel</button>
</div>

<div class="buehne">
  <p>Entwurf „Zugänge für Agenten“ mit dem Ablauf „Neuer Zugang“.<br>Im echten Redaktionsmodus öffnet sich der Dialog aus dem Konto-Menü. Alle Namen und Zeiten sind Beispielwerte.</p>
</div>

<dialog id="zugaenge" aria-labelledby="zh" class="breit">
  <div class="dlg-kopf"><h2 id="zh">Zugänge für Agenten</h2><button class="zu" data-close aria-label="Schließen">✕</button></div>
  <div class="dlg-rumpf" id="rumpf"></div>
  <div class="dlg-fuss" id="fuss"></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-text"></span></div>

<template id="t-liste">
  <p class="hinweis">Mit einem Zugang dürfen Claude Code oder eine geplante Aufgabe Artikel einreichen. Veröffentlichen kann kein Zugang – das bleibt deine Freigabe.</p>
  <ul class="liste" id="zugangsliste"></ul>
  <div class="nachfrage" id="ueberall-nachfrage"><div>
    <p>Überall abmelden? Du wirst auch hier abgemeldet. Die Zugänge der Agenten bleiben bestehen.</p>
    <div class="zeile"><button class="knopf klein-k" data-ueberall-nein>Abbrechen</button><button class="knopf primaer klein-k" data-ueberall-ja>Überall abmelden</button></div>
  </div></div>
</template>

<template id="t-neu">
  <form id="neu-form" novalidate>
    <label class="feld">Name
      <input id="f-name" name="name" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="z. B. laptop oder geplante-aufgabe" aria-describedby="f-name-hilfe">
      <span class="feldhilfe" id="f-name-hilfe">Kleinbuchstaben, Ziffern und Bindestrich. Erscheint im Protokoll als Urheber der Änderungen.</span>
    </label>
    <p class="feldfehler" id="f-name-fehler" role="alert" hidden></p>
    <fieldset class="rechtewahl">
      <legend>Darf</legend>
      <label class="wahl"><input type="checkbox" name="scope" value="blog:read" checked><b>Lesen</b><span class="info" tabindex="0" data-tipp="Briefing, Artikel, Queue und Statistik lesen. Ohne Lesen kann ein Agent nicht arbeiten.">i</span><small>Briefing, Artikel, Statistik</small></label>
      <label class="wahl"><input type="checkbox" name="scope" value="blog:write" checked><b>Schreiben und einreichen</b><span class="info" tabindex="0" data-tipp="Entwürfe anlegen, Bilder hochladen, zur Freigabe einreichen. Veröffentlichen kann kein Zugang.">i</span><small>Entwürfe, Bilder, Einreichen</small></label>
      <label class="wahl"><input type="checkbox" name="scope" value="blog:admin"><b>Einstellungen und Kategorien ändern</b><span class="info" tabindex="0" data-tipp="Richtlinien, Präferenzen und Kategorien. Öffentlich Sichtbares wird nur vorgeschlagen und wartet auf dich.">i</span><small>Richtlinien, Präferenzen, Kategorien</small></label>
    </fieldset>
    <p class="feldfehler" id="f-scope-fehler" role="alert" hidden>Wähle mindestens ein Recht.</p>
    <label class="feld">Läuft ab
      <select id="f-ablauf"><option value="">nie</option><option value="30">in 30 Tagen</option><option value="90">in 90 Tagen</option><option value="365">in einem Jahr</option></select>
    </label>
  </form>
</template>

<template id="t-ergebnis">
  <p class="erfolg"><svg class="ico"><use href="#i-check"/></svg><span>Zugang „<span id="e-name"></span>“ angelegt</span></p>
  <p class="hinweis warn-hinweis">Das Token siehst du nur jetzt. Kopiere es oder gleich den fertigen Befehl – danach ist es nicht mehr abrufbar.</p>
  <p class="ergebnis-titel">Befehl für Claude Code</p>
  <div class="kopierfeld"><pre id="e-befehl"></pre><button class="knopf klein-k" data-kopieren="e-befehl">Kopieren</button></div>
  <p class="ergebnis-titel">Nur das Token</p>
  <div class="kopierfeld"><code id="e-token"></code><button class="knopf klein-k" data-kopieren="e-token">Kopieren</button></div>
</template>

<script>
// ===== Nur Entwurf: Verhalten zum Ausprobieren, Beispieldaten =====
const $ = (s, r = document) => r.querySelector(s);
const dlg = $('#zugaenge'), rumpf = $('#rumpf'), fuss = $('#fuss');
const RECHT = { 'blog:read': 'Lesen', 'blog:write': 'Schreiben', 'blog:admin': 'Einstellungen' };
let zugaenge = [
  { id: 3, name: 'laptop', scopes: ['blog:read', 'blog:write'], zuletzt: 'heute 06:10', ablauf: '10.02.2027' },
  { id: 4, name: 'geplante-aufgabe', scopes: ['blog:read', 'blog:write'], zuletzt: 'gestern 22:00', ablauf: null },
  { id: 5, name: 'kategorien-pflege', scopes: ['blog:read', 'blog:admin'], zuletzt: null, ablauf: '09.12.2026' },
];
let leerAnsicht = false, frischGeholt = null;

function toast(text) { $('#toast-text').textContent = text; const t = $('#toast'); t.classList.add('zeigen'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('zeigen'), 2600); }
function knopf(text, cls, attr) { return `<button class="knopf ${cls}" ${attr}>${text}</button>`; }

function zeige(stand) {
  location.hash = stand;
  if (stand === 'liste') liste();
  if (stand === 'neu') neu();
  if (stand === 'ergebnis') ergebnis();
  rumpf.classList.remove('stand'); void rumpf.offsetWidth; rumpf.classList.add('stand');
}

function liste() {
  $('#zh').textContent = 'Zugänge für Agenten';
  rumpf.replaceChildren($('#t-liste').content.cloneNode(true));
  const ul = $('#zugangsliste');
  const daten = leerAnsicht ? [] : zugaenge;
  if (!daten.length) {
    ul.outerHTML = `<div class="leer"><svg class="ico"><use href="#i-schluessel"/></svg>Noch kein Zugang.<br>Lege einen an, damit Claude Code Artikel für dich einreichen kann.</div>`;
  }
  for (const z of daten) {
    const li = document.createElement('li');
    li.className = 'zugang';
    li.innerHTML = `<svg class="ico"><use href="#i-schluessel"/></svg>
      <span class="t"><b>${z.name}</b>
        <small>${z.zuletzt ? 'zuletzt ' + z.zuletzt : 'noch nie benutzt'} · ${z.ablauf ? 'läuft ab ' + z.ablauf : 'kein Ablauf'}</small>
        <span class="rechte">${z.scopes.map(s => `<span class="recht ${s === 'blog:admin' ? 'admin' : ''}">${RECHT[s]}</span>`).join('')}</span></span>
      <button class="knopf leise gefahr klein-k" data-widerruf>Widerrufen</button>
      <div class="nachfrage"><div><p>„${z.name}“ widerrufen? Agenten mit diesem Zugang verlieren sofort den Zugriff.</p>
        <div class="zeile"><button class="knopf klein-k" data-nein>Abbrechen</button><button class="knopf primaer klein-k" data-ja>Widerrufen</button></div></div></div>`;
    li.querySelector('[data-widerruf]').onclick = () => { li.querySelector('.nachfrage').classList.add('offen'); li.querySelector('[data-nein]').focus(); };
    li.querySelector('[data-nein]').onclick = () => li.querySelector('.nachfrage').classList.remove('offen');
    li.querySelector('[data-ja]').onclick = () => { li.classList.add('geht'); setTimeout(() => { zugaenge = zugaenge.filter(x => x !== z); liste(); toast(`Zugang „${z.name}“ widerrufen.`); }, 260); };
    ul.append(li);
  }
  fuss.innerHTML = knopf('Überall abmelden', '', 'data-ueberall') + knopf('<svg class="ico"><use href="#i-plus"/></svg>Neuer Zugang …', 'primaer', 'data-neu');
  fuss.querySelector('[data-neu]').onclick = () => zeige('neu');
  fuss.querySelector('[data-ueberall]').onclick = () => $('#ueberall-nachfrage').classList.add('offen');
  $('[data-ueberall-nein]').onclick = () => $('#ueberall-nachfrage').classList.remove('offen');
  $('[data-ueberall-ja]').onclick = () => { dlg.close(); toast('Auf allen Geräten abgemeldet.'); };
}

function neu() {
  $('#zh').textContent = 'Neuer Zugang';
  rumpf.replaceChildren($('#t-neu').content.cloneNode(true));
  fuss.innerHTML = knopf('Zurück', '', 'data-zurueck') + knopf('Zugang anlegen', 'primaer', 'type="submit" form="neu-form"');
  fuss.querySelector('[data-zurueck]').onclick = () => zeige('liste');
  $('#neu-form').onsubmit = anlegen;
  $('#f-name').focus();
}

function anlegen(e) {
  e.preventDefault();
  const name = $('#f-name').value.trim();
  const scopes = [...document.querySelectorAll('input[name=scope]:checked')].map(i => i.value);
  let ok = true;
  const nf = $('#f-name-fehler');
  if (!/^[a-z0-9][a-z0-9-]{0,39}$/.test(name)) { nf.textContent = name ? 'Nur Kleinbuchstaben, Ziffern und Bindestrich, höchstens 40 Zeichen, nicht mit Bindestrich beginnen.' : 'Gib dem Zugang einen Namen.'; nf.hidden = false; $('#f-name').setAttribute('aria-invalid', 'true'); ok = false; }
  else if (zugaenge.some(z => z.name === name)) { nf.textContent = `Einen Zugang „${name}“ gibt es schon. Wähle einen anderen Namen oder widerrufe den alten.`; nf.hidden = false; $('#f-name').setAttribute('aria-invalid', 'true'); ok = false; }
  else { nf.hidden = true; $('#f-name').removeAttribute('aria-invalid'); }
  $('#f-scope-fehler').hidden = scopes.length > 0; if (!scopes.length) ok = false;
  if (!ok) { const erstes = document.querySelector('.feldfehler:not([hidden])'); erstes && erstes.previousElementSibling?.querySelector?.('input')?.focus(); return; }
  const ablauf = $('#f-ablauf').value;
  const hex = Array.from(crypto.getRandomValues(new Uint8Array(32)), b => b.toString(16).padStart(2, '0')).join('');
  frischGeholt = { name, token: 'dmcp_' + hex };
  zugaenge.unshift({ id: Date.now(), name, scopes, zuletzt: null, ablauf: ablauf ? `in ${ablauf} Tagen` : null });
  zeige('ergebnis');
}

function ergebnis() {
  if (!frischGeholt) return zeige('liste');
  $('#zh').textContent = 'Zugang angelegt';
  rumpf.replaceChildren($('#t-ergebnis').content.cloneNode(true));
  $('#e-name').textContent = frischGeholt.name;
  $('#e-token').textContent = frischGeholt.token;
  $('#e-befehl').textContent = `claude mcp add --transport http dispatch https://quantum-canvas.de/dispatch/mcp --header "Authorization: Bearer ${frischGeholt.token}"`;
  rumpf.querySelectorAll('[data-kopieren]').forEach(b => b.onclick = () => {
    navigator.clipboard?.writeText($('#' + b.dataset.kopieren).textContent).catch(() => {});
    b.textContent = 'Kopiert'; b.classList.add('ok'); toast('Kopiert.');
  });
  fuss.innerHTML = knopf('Fertig', 'primaer', 'data-fertig');
  fuss.querySelector('[data-fertig]').onclick = () => { frischGeholt = null; zeige('liste'); };
}

function oeffnen() { if (!dlg.open) dlg.showModal(); const h = location.hash.slice(1); zeige(['neu', 'ergebnis'].includes(h) ? h : 'liste'); }
document.addEventListener('click', e => { if (e.target.closest('[data-close]')) dlg.close(); });
dlg.addEventListener('close', () => { frischGeholt = null; });
$('#p-oeffnen').onclick = oeffnen;
$('#p-leer').onclick = e => { leerAnsicht = !leerAnsicht; e.target.setAttribute('aria-pressed', leerAnsicht); if (dlg.open) zeige('liste'); };
$('#p-thema').onclick = () => { const r = document.documentElement; const dunkel = r.classList.contains('dunkel') || (!r.classList.contains('hell') && matchMedia('(prefers-color-scheme: dark)').matches); r.classList.toggle('dunkel', !dunkel); r.classList.toggle('hell', dunkel); };
const stufen = [[576, 'xs · Handy'], [768, 'sm'], [992, 'md · Tablet'], [1200, 'lg · Laptop'], [1408, 'xl'], [Infinity, 'xxl · Desktop']];
function stufe() { $('#stufe').textContent = stufen.find(([w]) => innerWidth < w)[1] + ' · ' + innerWidth + ' px'; }
addEventListener('resize', stufe); stufe();
const p = new URLSearchParams(location.search);
if (p.get('thema') === 'dunkel') document.documentElement.classList.add('dunkel');
if (p.get('thema') === 'hell') document.documentElement.classList.add('hell');
if (p.get('leer') === '1') { leerAnsicht = true; $('#p-leer').setAttribute('aria-pressed', 'true'); }
if (p.get('demo') === 'ergebnis') frischGeholt = { name: 'laptop-2', token: 'dmcp_' + '3f9a'.repeat(16) };
if (location.hash || p.has('offen')) oeffnen();
if (p.get('demo') === 'fehler') { $('#f-name').value = 'Laptop Neu'; $('#neu-form').requestSubmit(); }
if (p.get('demo') === 'nachfrage') document.querySelector('[data-widerruf]')?.click();
</script>
</body>
</html>
