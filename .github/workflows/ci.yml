name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: none

      - name: PHP-Syntax pruefen
        run: |
          files=$(git ls-files 'app/*.php' 'bridge/*.php' 'bin/*')
          if [ -z "$files" ]; then
            echo "Noch keine PHP-Dateien."
            exit 0
          fi
          status=0
          for f in $files; do
            php -l "$f" > /dev/null || { php -l "$f"; status=1; }
          done
          exit $status
